name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tools experiments tests
      - run: python -m unittest discover -s tests -v
      - name: Native FTM result regression (offline)
        run: |
          mkdir -p artifacts
          cc -std=c11 -Wall -Wextra -Werror tests/native_ftm_result.c -o artifacts/native_ftm_result
          ./artifacts/native_ftm_result
      - run: python tools/qualcomm_probe.py --help
      - run: python tools/analyze_tsf_series.py --help
      - run: python experiments/qualcomm/analyze_latch.py --help
      - run: python experiments/qualcomm/decode_ftm_response.py --help
  windows-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell tools without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools,experiments,tests -Recurse -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Reject malformed FTM delta logs (offline)
        shell: powershell
        run: ./tests/Test-FtmDeltaLogParser.ps1
      - name: Check passive launcher exit codes (no acquisition)
        shell: powershell
        run: ./tests/Test-PassiveLauncher.ps1
      - name: Check scan context classification (no acquisition)
        shell: powershell
        run: ./tests/Test-ScanContextSummary.ps1
      - name: Check bounded NDIS child helper (no tracing)
        shell: powershell
        run: |
          ./tests/Test-NdisCaptureHelpers.ps1
          ./tests/Test-NdisCaptureHelpers.ps1 -CaptureScript ./experiments/qualcomm/Capture-NdisTimestampStatusV2.ps1
          ./tests/Test-NdisV2Preflight.ps1
          ./tests/Test-NdisV2Health.ps1
      - name: Build documented-query and health helpers (no acquisition)
        shell: powershell
        run: |
          ./experiments/qualcomm/Build-NdisExperiment.ps1 -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ./artifacts/ndis-experiment-x64/ndis_query_probe.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Probe help failed' }
          ./artifacts/ndis-experiment-x64/ndis_trace_health.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Health help failed' }
