name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/qualcomm_probe.py --help
      - run: python tools/analyze_tsf_series.py --help
  windows-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell tools without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
