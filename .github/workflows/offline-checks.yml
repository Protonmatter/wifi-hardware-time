name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Archive integrity compares exact blobs and the full Markdown inventory.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -v
        env:
          WIFI_TIME_NATIVE_CC: cc
      - name: Check authored index and all diagram embeds
        run: |
          python research/evidence/build_knowledge_index.py --check
          python research/evidence/sync_workflow_diagrams.py --check
          python research/evidence/publish_archify_previews.py --check
          python research/evidence/sync_tsf_headlines.py --check
      - name: Native FTM result regression (offline)
        run: |
          mkdir -p artifacts
          cc -std=c11 -Wall -Wextra -Werror tests/native_ftm_result.c -o artifacts/native_ftm_result
          ./artifacts/native_ftm_result
      - run: python research/tsf/qualcomm_probe.py --help
      - run: python research/tsf/analyze_tsf_series.py --help
      - run: python research/tsf/analyze_latch.py --help
      - run: python research/ftm/decode_ftm_response.py --help
  windows-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Archive integrity compares exact blobs and the full Markdown inventory.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Full Windows Python suite (offline; no adapter requests)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q research tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python research/evidence/sync_tsf_headlines.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preview, apply, repeat and failure checks (authored fixtures only)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_static_inspection.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_knowledge_index.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell tools without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem research,tests -Recurse -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Reject malformed FTM delta logs (offline)
        shell: powershell
        run: ./tests/Test-FtmDeltaLogParser.ps1
      - name: Owned timestamp export contract (offline)
        shell: powershell
        run: ./research/export_contract/Test-TimestampExport.ps1 -Architecture x64
      - name: Concurrent raw-event response broker (no hardware)
        shell: powershell
        run: ./research/export_contract/Build-RawEventBroker.ps1 -Architecture x64
      - name: Build saved TSF trace-byte exporter (no acquisition)
        shell: powershell
        run: ./research/tsf/Build-TsfTraceBytes.ps1 -Architecture x64
      - name: Device-service positive control build and rejection tests (no hardware)
        shell: powershell
        run: |
          ./research/adapters/Invoke-DeviceServiceControl.ps1 -BuildOnly -Architecture x64 -OutputDirectory artifacts/service-control-ci
          if ($LASTEXITCODE -ne 0) { throw 'Device-service build/self-test failed' }
          ./tests/Test-DeviceServiceControl.ps1
      - name: Check passive launcher exit codes (no acquisition)
        shell: powershell
        run: ./tests/Test-PassiveLauncher.ps1
      - name: Check packet observer child status and cleanup (no acquisition)
        shell: powershell
        run: ./tests/Test-WifiPathHelpers.ps1
      - name: Check registry observer child status and cleanup (no acquisition)
        shell: powershell
        run: ./tests/Test-QutsRegistryHelpers.ps1
      - name: Reject buffered exporter output failure (stubbed trace APIs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio unavailable' }
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $env:WIFI_TIME_NATIVE_CC = 'cl.exe'
          python -m unittest discover -s tests -p test_trace_export_output.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check scan context classification (no acquisition)
        shell: powershell
        run: ./tests/Test-ScanContextSummary.ps1
      - name: Check bounded NDIS child helper (no tracing)
        shell: powershell
        run: |
          ./tests/Test-NdisCaptureHelpers.ps1
          ./tests/Test-NdisCaptureHelpers.ps1 -CaptureScript ./research/windows_timestamps/Capture-NdisTimestampStatusV2.ps1
          ./tests/Test-NdisV2Preflight.ps1
          ./tests/Test-NdisV2Health.ps1
      - name: Build documented-query and health helpers (no acquisition)
        shell: powershell
        run: |
          ./research/windows_timestamps/Build-NdisExperiment.ps1 -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ./artifacts/ndis-experiment-x64/ndis_query_probe.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Probe help failed' }
          ./artifacts/ndis-experiment-x64/ndis_trace_health.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Health help failed' }
